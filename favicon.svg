<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A1813"/>
      <stop offset="60%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA821A"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8C6B14" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#D4AF37" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Royal Star Accent -->
  <g transform="translate(256, 118)" filter="url(#goldShadow)">
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3.5" fill="#0E0E10"/>
  </g>

  <!-- Monogram AB -->
  <text x="256" y="280" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="140" font-weight="800" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="4" filter="url(#goldShadow)">
    AB
  </text>

  <!-- Divider Line -->
  <line x1="156" y1="316" x2="356" y2="316" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="256" cy="316" r="4" fill="url(#goldGrad)"/>

  <!-- Subtitle -->
  <text x="256" y="360" font-family="'Cinzel', 'Times New Roman', 'Georgia', sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="9">
    AL-BHURANI
  </text>
  <text x="256" y="396" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#A1A1AA" letter-spacing="6">
    RETAIL POS
  </text>
</svg>